dependencies:
  idf:
    version: ">=5.3"
  # Graphics stack. LVGL must be >=9.3 because recent esp_lvgl_port uses
  # LV_COLOR_FORMAT_RGB565_SWAPPED, which only exists from LVGL 9.3 onward.
  lvgl/lvgl: "~9.3.0"
  espressif/esp_lvgl_port: "^2.4.0"
  # SPD2010 round QSPI LCD + its capacitive touch
  espressif/esp_lcd_spd2010: "^1.0.2"
  espressif/esp_lcd_touch_spd2010: "^1.0.0"
  # TCA9554 I2C GPIO expander (drives LCD/touch reset + SD CS)
  espressif/esp_io_expander_tca9554: "^1.0.1"
  # NOTE: the on-device wake word (espressif/esp-sr) is intentionally NOT a
  # default dependency: it's a very large download that slows every build.
  # To enable hands-free wake word, uncomment the line below, add the 'model'
  # partition back to partitions.csv, and set CONFIG_VEE_WAKE_WORD=y.
  #   espressif/esp-sr: "^1.0"
